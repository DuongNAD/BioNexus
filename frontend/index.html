<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030807" />
    <meta
      name="description"
      content="BioNexus — Bách khoa toàn thư sinh học 6 cấp phân loại và sàn giao dịch sinh vật cảnh nhân giống có kiểm duyệt pháp lý tại Việt Nam."
    />
    <!-- Đặt chế độ sáng/tối trước khi vẽ trang để không nháy màu (khoá giống lib/theme.ts) -->
    <script>
      try {
        if (localStorage.getItem('bionexus.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f8f5');
        }
      } catch (e) {}
    </script>
    <title>BioNexus — Sinh quyển Số & Sàn sinh vật cảnh</title>
    <!-- Favicon SVG cùng hình với components/ui/Logo.tsx: chuỗi xoắn kép, nét dày hơn để rõ ở 16 px -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-linecap='round'%3E%3Cpath d='M23 4C23 8.4 9 11.6 9 16S23 23.6 23 28' stroke='%235eead4' stroke-width='3.2' opacity='0.7'/%3E%3Cpath d='M12 7h8M12 13h8M12 19h8M12 25h8' stroke='%236ee7b7' stroke-width='2' opacity='0.55'/%3E%3Cpath d='M9 4C9 8.4 23 11.6 23 16S9 23.6 9 28' stroke='%236ee7b7' stroke-width='3.2'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-bg text-fg min-h-screen antialiased selection:bg-accent selection:text-accent-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
